description: >-
  Infor ships a first-party client-side component system — the Infor Design
  System (IDS) — used to build the UI of Infor CloudSuite applications and of
  customer extensions (Mongoose, M3 H5 / Odin, Infor OS widgets). These are
  embeddable UI libraries, distinct from the API client SDKs in
  packages/infor-packages.yml. Infor publishes no hosted/embedded widget
  (no embedded dashboard, no drop-in checkout-style surface); everything here
  installs into the customer's own build.
