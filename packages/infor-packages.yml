description: >-
  First-party Infor client libraries. Infor does not ship a generic REST SDK for
  the ION API Gateway on a public package registry: the ION API SDK is a Java
  source repository (github.com/infor-cloud/ion-api-sdk) distributed as source,
  not as a Maven Central artifact. The published packages are the M3 H5 "Odin"
  SDK for building M3 web applications, the XtendM3 Java SDK + Maven plugin for
  writing M3 extensions, and the Infor Design System (IDS) front-end libraries.
