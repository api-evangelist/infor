description: >-
  Infor publishes one first-party command-line tool on a public registry: the
  Odin CLI, shipped as @infor-up/m3-odin-cli and exposing the `odin` binary.
  It scaffolds and builds Infor M3 H5 web applications against the M3 API; it
  is a development/build tool, not a general client for the ION API Gateway.
  There is no published first-party CLI for the ION API Gateway itself.
