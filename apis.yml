- aid: infor:infor-idm-api
  name: Infor Document Management (IDM) API
  description: The Infor Document Management REST API, published on the Infor Developer Portal at developer.infor.com/api
    and served through the ION API Gateway under the IDM suite path. It covers the content repository
    (items, resources, versions, check-in/check-out), business context models, document templates, the
    data model, document output, content migration, e-mail delivery, digital signature envelopes and user
    analytics — 94 operations documented across eleven groups. Infor publishes the reference and a machine-readable
    Markdown projection (developer.infor.com/api/llms.txt) but exposes no downloadable OpenAPI document,
    so no spec is captured in this repo.
