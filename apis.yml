name: Infor
description: Infor provides industry-specific cloud ERP platforms including CloudSuite Industrial (M3),
  CloudSuite Financials, and Infor LN. The Infor ION API Gateway enables OAuth 2.0-based integration across
  Infor applications and third-party systems. SDKs are available via the infor-cloud GitHub organization
  for Java, .NET, Go, and HTML5 development.
