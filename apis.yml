  generated: '2026-09-13'
  method: searched
  note: 'Corrected 2026-09-13. The previous "Self-serve signup" label was wrong: Infor publishes no pricing
    page (https://www.infor.com/pricing returns 404) and no developer self-signup. API credentials are
    issued as a per-tenant .ionapi file by an IONAPI-Administrator inside an existing CloudSuite subscription;
    developer.infor.com documents the APIs publicly but grants no access. https://concierge.infor.com
    is a customer login, not a signup.'
