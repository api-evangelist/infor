      summary: Get product version language contents by product version language id
      x-summary-source: derived
      operationId: getProductVersionLanguageContentsByProductVersionLanguageId
      x-operation-id-source: derived
  /productVersionLanguageContents/{productVersionLanguageId}/contents:
    get:
      tags:
      - Products
      description: Returns the product versions language active contents with details by Product Version Language Id in ascending positions
      parameters:
      - in: path
        name: productVersionLanguageId
        schema:
          type: string
        required: true
        description: product version language id
      - in: query
        name: deploymentType
        schema:
          type: string
        required: false
        description: Deployment type to filter contents (e.g. cloud, on-prem, IGS)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Get product version language contents by product version language id contents
      x-summary-source: derived
      operationId: getProductVersionLanguageContentsByProductVersionLanguageIdContents
      x-operation-id-source: derived
  /productVersionLanguageContents/archive/{productVersionLanguageId}/contents:
    get:
      tags:
      - Products
      description: Returns the product versions language archived contents with details by Product Version Language Id in ascending positions
      parameters:
      - in: path
        name: productVersionLanguageId
        schema:
          type: string
        required: true
        description: product version language id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Get product version language contents archive by product version language id…
      x-summary-source: derived
      operationId: getProductVersionLanguageContentsArchiveByProductVersionLanguageIdContents
      x-operation-id-source: derived
components:
  schemas:
    RedirectUrl:
      type: object
      properties:
        url_redirect_mapping_id:
          type: integer
        product_code:
          type: string
        doc_version:
          type: string
        language:
          type: string
        doc_id:
          type: string
        page:
          type: string
        help_content:
          type: string
        topic:
          type: string
        redirect_product_code:
          type: string
        redirect_doc_version:
          type: string
        redirect_language:
          type: string
        redirect_doc_id:
          type: string
        redirect_page:
          type: string
        redirect_help_content:
          type: string
        redirect_topic:
          type: string
    Error:
      type: object
      properties:
        error:
          type: string
    DeploymentType:
      type: object
      properties:
        id:
          type: integer
        deployment_type:
          type: string
    ProductVersion:
      type: object
      properties:
        product_version_id:
          type: string
        product_code:
          type: string
        product_longname:
          type: string
        doc_version:
          type: string
        doc_version_name:
          type: string
        drm_release:
          type: string
        drm_version:
          type: string
        active:
          type: boolean
        position:
          type: integer
        archive:
          type: boolean
        archive_position:
          type: integer
        genai:
          type: string
        webhelp9:
          type: boolean
        search:
          type: boolean
          description: Determines whether the product version should be searchable and discoverable through indexing.
        ga_plus_1:
          type: boolean
          description: Identifies versions that should be treated as generally available or later for indexing purposes.
        old_names:
          type: string
          description: Comma-separated former product names, added at runtime by ProductVersionService; not a column on product_versions.
    Product:
      type: object
      properties:
        product_code:
          type: string
        product_shortname:
          type: string
        product_line:
          type: string
        active:
          type: boolean
        archive:
          type: boolean
        latest_redirect:
          type: boolean
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-provenance:
  method: harvested
  publisher: Infor
  source: https://docs.infor.com/swagger.json
