        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Get product solutions
      x-summary-source: derived
      operationId: getProductSolutions
      x-operation-id-source: derived
  /productSolutions/search/findBySolutionId/{solutionId}:
    get:
      tags:
      - Products
      description: Returns the product solutions searched by solution Id
      parameters:
      - in: path
        name: solutionId
        schema:
          type: integer
        required: true
        description: Solution ID
      responses:
        '200':
          description: An array of product solutions searched by solution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '204':
          description: No Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Get product solutions search find by solution id by solution id
      x-summary-source: derived
      operationId: getProductSolutionsSearchFindBySolutionIdBySolutionId
      x-operation-id-source: derived
  /productVersions:
    get:
      tags:
      - Products
      description: Returns all product Versions
      responses:
        '200':
          description: An array of product Versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '204':
          description: No Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Get product versions
      x-summary-source: derived
      operationId: getProductVersions
      x-operation-id-source: derived
  /productVersions/search/findByProductCode/{productCode}:
    get:
      tags:
      - Products
      description: Returns a single product
      parameters:
      - in: path
        name: productCode
        schema:
          type: string
        required: true
        description: Product Code
      responses:
        '200':
          description: An array of product versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '204':
          description: No Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Get product versions search find by product code by product code
      x-summary-source: derived
      operationId: getProductVersionsSearchFindByProductCodeByProductCode
      x-operation-id-source: derived
  /productVersions/search/findByProductCodeAndActiveTrueOrderByPositionAsc/{productCode}:
    get:
      tags:
      - Products
      description: Returns the product versions information searched by product code ,active and position in ascending order
      parameters:
      - in: path
        name: productCode
        schema:
          type: string
        required: true
        description: Product Code
      responses:
        '200':
          description: An array of product versions information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '204':
          description: No Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Get product versions search find by product code and active true order by…
      x-summary-source: derived
      operationId: getProductVersionsSearchFindByProductCodeAndActiveTrueOrderByPositionAscByProductCode
      x-operation-id-source: derived
  /productVersions/search/findByProductCodeOrderByPositionAsc/{productCode}:
    get:
      tags:
      - Products
      description: Returns all product versions (active and inactive) searched by product code ordered by position in ascending order
      parameters:
      - in: path
        name: productCode
        schema:
          type: string
        required: true
        description: Product Code
      responses:
        '200':
          description: An array of product versions information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '204':
          description: No Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Get product versions search find by product code order by position asc by…
      x-summary-source: derived
      operationId: getProductVersionsSearchFindByProductCodeOrderByPositionAscByProductCode
      x-operation-id-source: derived
  /productVersions/search/findByProductCodeWithTranslatedContent/{productCode}:
    get:
      tags:
      - Products
      summary: Retrieve versions for a translated site language
      description: Version dropdown list for a non en-us site language, ordered by position ascending. Active versions are always included; inactive versions only when they hold active, non-archived translated content. Empty array when none qualify. For en-us use findByProductCodeAndActiveTrueOrderByPositionAsc.
      parameters:
      - in: path
        name: productCode
        schema:
          type: string
        required: true
        description: Product Code
      responses:
        '200':
          description: An array of product versions, empty when no version qualifies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductVersion'
        '204':
          description: No Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getProductVersionsSearchFindByProductCodeWithTranslatedContentByProductCode
      x-operation-id-source: derived
  /productVersions/search/findByProductCodeAndArchiveTrueOrderByPositionAsc/{productCode}:
    get:
      tags:
      - Products
      description: Returns the product versions information searched by product code ,archive and position in ascending order
      parameters:
      - in: path
        name: productCode
        schema:
          type: string
        required: true
        description: Product Code
      responses:
        '200':
          description: An array of product versions information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '204':
          description: No Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Get product versions search find by product code and archive true order by…
      x-summary-source: derived
      operationId: getProductVersionsSearchFindByProductCodeAndArchiveTrueOrderByPositionAscByProductCode
      x-operation-id-source: derived
  /productVersionLanguageContents:
    get:
      tags:
      - Products
      description: Returns all product Version Language Contents
      responses:
        '200':
          description: An array of product Version Language Contents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '204':
          description: No Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Get product version language contents
      x-summary-source: derived
      operationId: getProductVersionLanguageContents
      x-operation-id-source: derived
  /productVersionLanguageContents/{productVersionLanguageId}:
    get:
      tags:
      - Products
      description: Returns the product versions language Contents by Product Version Language Id in ascending positions
      parameters:
      - in: path
        name: productVersionLanguageId
        schema:
          type: string
        required: true
        description: product version language id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
