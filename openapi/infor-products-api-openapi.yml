openapi: 3.2.0
info:
  title: Infor Docs Products API
  version: 2.0.0
  description: Infor Documentation API.
servers:
- url: /api/v2
security:
- bearerAuth: []
tags:
- name: Products
paths:
  /products:
    get:
      tags:
      - Products
      description: Returns all products
      responses:
        '200':
          description: An array of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '204':
          description: No Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Get products
      x-summary-source: derived
      operationId: getProducts
      x-operation-id-source: derived
  /redirectUrl:
    get:
      tags:
      - Products
      description: Returns redirect url
      parameters:
      - in: query
        name: product_code
        schema:
          type: string
        required: true
        description: product code
      - in: query
        name: version
        schema:
          type: string
        required: true
        description: document version
      - in: query
        name: lang
        schema:
          type: string
        required: true
        description: language
      - in: query
        name: docId
        schema:
          type: string
        required: true
        description: document id
      responses:
        '200':
          description: Redirect url mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedirectUrl'
        '204':
          description: No Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Get redirect url
      x-summary-source: derived
      operationId: getRedirectUrl
      x-operation-id-source: derived
  /redirectUrlmapping:
    get:
      tags:
      - Products
      description: Returns all redirect url mapping
      responses:
        '200':
          description: Redirect url mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedirectUrl'
        '204':
          description: No Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Get redirect urlmapping
      x-summary-source: derived
      operationId: getRedirectUrlmapping
      x-operation-id-source: derived
  /productDeploymentTypes:
    get:
      tags:
      - Products
      description: Returns all product deployment types
      responses:
        '200':
          description: An array of deployment types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentType'
        '204':
          description: No Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Get product deployment types
      x-summary-source: derived
      operationId: getProductDeploymentTypes
      x-operation-id-source: derived
  /productLanguages:
    get:
      tags:
      - Products
      description: Returns all product languages
      responses:
        '200':
          description: An array of product languages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '204':
          description: No Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Get product languages
      x-summary-source: derived
      operationId: getProductLanguages
      x-operation-id-source: derived
  /productLanguages/search/findByLanguage/{language}:
    get:
      tags:
      - Products
      description: Returns the product languages searched by a language
      parameters:
      - in: path
        name: language
        schema:
          type: string
        required: true
        description: Language ID
      responses:
        '200':
          description: An array of product languages searched by a language
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '204':
          description: No Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Get product languages search find by language by language
      x-summary-source: derived
      operationId: getProductLanguagesSearchFindByLanguageByLanguage
      x-operation-id-source: derived
  /productSolutions:
    get:
      tags:
      - Products
      description: Returns all product solutions
      responses:
        '200':
