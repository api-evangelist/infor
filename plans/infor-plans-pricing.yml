provider: Infor
providerId: infor
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - ERP
  - CloudSuite
  - Industry Cloud
  - Enterprise Software
description: Infor sells industry-specific CloudSuite ERP, SCM, HCM, and PLM products through a contact-sales
  motion. Pricing is not published; quotes are negotiated per customer based on industry, modules, named
  users, environment count, and term. APIs (Infor ION, M3, LN, CloudSuite Industrial APIs) are bundled
  with the licensed product rather than offered as a separately metered API service.
notes: All Infor pricing is contact-sales. Reconcile against an Infor sales quote.
sources:
  - https://www.infor.com/products
  - https://www.infor.com/contact-us
plans:
  - id: infor-cloudsuite
    name: Infor CloudSuite
    type: enterprise
    description: Industry-specific cloud ERP suite (Manufacturing, Distribution, Healthcare, Public Sector,
      etc.) with bundled APIs via Infor OS / ION. Pricing per customer.
    entries:
      - label: Subscription
        description: Negotiated annual subscription covering modules and user count
        name: subscription
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: global
        domains:
          - https://mingle-ionapi.{region}.inforcloudsuite.com
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Industry-specific data models
      - name: Infor ION integration platform
      - name: Infor OS
      - name: APIs bundled with license
      - name: Customer Success Manager
