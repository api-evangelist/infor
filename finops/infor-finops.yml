specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Infor
providerId: infor
publisherName: Infor, Inc.
serviceCategory: Enterprise Software
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - ERP
  - CloudSuite
  - Industry Cloud
  - FinOps
  - FOCUS
description: FOCUS-aligned FinOps shape for Infor. Billing is enterprise subscription with negotiated
  per-customer terms; APIs are bundled into Infor OS / ION rather than separately metered. FinOps practice
  for Infor focuses on subscription accountability, environment / module right-sizing at renewal, and
  named-user hygiene.
notes: No public usage-based meters. Reconcile against the customer's own Infor invoice and Infor OS
  utilization telemetry.
sources:
  - https://www.infor.com/products
  - https://www.infor.com/contact-us
principles:
  - name: Visibility
    description: Use Infor OS Homepages and ION monitoring to see API and document-flow utilization;
      surface annual subscription costs in finance reporting.
  - name: Allocation
    description: Allocate the Infor subscription across business units by module entitlement, named-user
      counts, and active environments (production / test / development).
  - name: Optimization
    description: Right-size named-user counts at renewal, retire unused environments and modules, consolidate
      ION integrations to reduce shared-services pressure.
  - name: Accountability
    description: Designate an Infor application owner with a single annual budget line; review module
      and user utilization quarterly with the Infor Customer Success Manager.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Budgeting
      - Benchmarking
  - name: Optimize Usage and Cost
    capabilities:
      - Workload Optimization
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - Invoicing and Chargeback
      - Onboarding Workloads
billingModel:
  pricingCategory: Enterprise Subscription
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Tax
    - Adjustment
  chargeFrequency: Recurring
focusColumns:
  ServiceName: Infor CloudSuite
  ServiceCategory: Enterprise Software
  ProviderName: Infor
  PublisherName: Infor, Inc.
  InvoiceIssuerName: Infor, Inc.
  PricingCategory: Subscription
  PricingUnit: user-year
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: named_users
    description: Named users licensed per module
    unit: user-month
    aggregation: max
    dimensions:
      - module
      - environment
  - name: environments
    description: Active CloudSuite environments (production, test, development)
    unit: environment-month
    aggregation: max
    dimensions:
      - environment_type
      - region
  - name: ion_documents
    description: Document flows processed through Infor ION
    unit: document
    aggregation: sum
    dimensions:
      - flow
      - source_app
      - target_app
apis:
  - name: Infor ION API
    baseURL: https://mingle-ionapi.{region}.inforcloudsuite.com
    serviceCategory: API
  - name: Infor CloudSuite APIs
    baseURL: https://mingle-ionapi.{region}.inforcloudsuite.com
    serviceCategory: API
unitEconomics:
  - name: Cost per Named User
    metric: billed_cost / named_users
    target: TBD
  - name: Cost per Active Environment
    metric: billed_cost / environments
    target: TBD
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
